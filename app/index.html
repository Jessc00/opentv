<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenTV</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d10; color: #f2f4f7; font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; text-align: center; }
  h1 { font-size: 64px; font-weight: 300; letter-spacing: 2px; margin: 0 0 20px; }
  p { font-size: 26px; opacity: .7; margin: 0; max-width: 1100px; line-height: 1.5; }
  .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: #d1fe17; margin-right: 14px;
         animation: pulse 1.2s ease-in-out infinite; vertical-align: middle; }
  @keyframes pulse { 50% { opacity: .25; } }
</style>
</head>
<body>
<div>
  <h1>OpenTV</h1>
  <p id="msg"><span class="dot"></span>Starting up...</p>
</div>
<script>
/* TizenBrew opens this page first and starts OpenTV's service (service/service.js) on the TV. As soon as the
   service answers, we move over to it: it serves the real home screen on port 4940, with the same addresses
   the phone remote uses. The part of our own address after /module/ tells the service where OpenTV's files live. */
(function () {
  var SERVICE = "http://127.0.0.1:4940/";
  var parts = location.pathname.split("/");
  var at = parts.indexOf("module");
  var mod = at >= 0 ? parts[at + 1] : "";
  var started = Date.now();

  function go() { location.replace(SERVICE + (mod ? "?m=" + mod : "")); }
  function wait() {
    var x = new XMLHttpRequest();
    x.open("GET", SERVICE + "api/ping?t=" + Date.now());
    x.timeout = 3000;
    x.onload = function () { if (x.status === 200) go(); else retry(); };
    x.onerror = x.ontimeout = retry;
    x.send();
  }
  function retry() {
    if (Date.now() - started > 45000) {
      document.getElementById("msg").innerHTML = "OpenTV's helper didn't start.<br>Press Back, then open OpenTV again from TizenBrew. " +
        "If it keeps happening, check the internet connection: the first start downloads OpenTV.";
      return;
    }
    setTimeout(wait, 700);
  }
  wait();
})();
</script>
</body>
</html>
